name: Calculator CI

on:
  pull_request
    branches:main
  "3.11"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: tests
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Run the tests
        run: -m pytest -v
