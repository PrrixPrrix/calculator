name: Calculator CI

on:
  push:
    branches: main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Run the tests
        run: -m pytest -v
